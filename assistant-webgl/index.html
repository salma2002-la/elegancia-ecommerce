<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | AvatarWebGLClean</title>
  
  <style>
    * { margin: 0 !important; padding: 0 !important; box-sizing: border-box; }
    html, body { width: 100% !important; height: 100% !important; background: #000; display: flex !important; justify-content: center !important; align-items: center !important; }
    #unity-container { width: 780px !important; height: 480px !important; }
    #unity-canvas { width: 780px !important; height: 480px !important; display: block !important; }
</style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/assistant-webgl.loader.js";
    var config = {
      dataUrl: buildUrl + "/assistant-webgl.data",
      frameworkUrl: buildUrl + "/assistant-webgl.framework.js",
      codeUrl: buildUrl + "/assistant-webgl.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "AvatarWebGLClean",
      productVersion: "0.1",
      matchWebGLToCanvasSize: true,
      TOTAL_STACK: 5 * 1024 * 1024,
      TOTAL_MEMORY: 512 * 1024 * 1024,
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {}).then((unityInstance) => {
        console.log("Unity loaded ✅");
      }).catch(alert);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
